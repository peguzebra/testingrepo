# sonarqube-analysis-in-docker.yml
name: Trial flow (name)
run-name: Trial flow ()run-name

on:
  push:
    # Sequence of patterns matched against refs/heads
    branches:
      - 'main/**'
jobs:
  JobA:
    name: Trial job A
    #runs-on: vc1120
    #runs-on: vc1392
    runs-on: ubuntu-latest
    #container:
    #  image: ubuntu:22.04
    #defaults:
    #  run:
    #    shell: bash --noprofile --norc -eo pipefail -x {0}
    steps:
      - name: Job A - Step 1
        run: |
          echo "Hello world"
          env
          pwd
          cat <<'EOF' > ./artifact1.txt
          This is the file to be stored.
          EOF
      - name: Job A - Upload
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ./artifact1.txt
          #retention-days: 7   # optional, default is repo setting (usually 90 days)
